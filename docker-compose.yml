services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gotogether
      POSTGRES_PASSWORD: gotogether
      POSTGRES_DB: gotogether
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_gotogether_core.sql:/docker-entrypoint-initdb.d/001_gotogether_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotogether -d gotogether"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://gotogether:gotogether@db:5432/gotogether}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
